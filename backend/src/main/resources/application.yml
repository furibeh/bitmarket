spring:
  application:
    name: bitmarket
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:bitmarket}}
    username: ${DB_USER:bitmarket}
    password: ${DB_PASSWORD:bitmarket}
  flyway:
    placeholders:
      bff_password: ${BFF_DB_PASSWORD:bitmarket_bff}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
