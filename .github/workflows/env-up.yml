name: env-up

on:
  workflow_dispatch:

permissions:
  contents: read

# Shared with env-down so the two never run at the same time. Never cancelled:
# interrupting Terraform would leave its state locked.
concurrency:
  group: ephemeral-environment
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aws-deploy
    defaults:
      run:
        working-directory: infra/ephemeral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Initialize Terraform
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false -lockfile=readonly -backend-config="bucket=bitmarket-tfstate-$account_id"
      # Re-applying must not reset the environment's age (bitmarket:created-at).
      - name: Resolve the creation time
        run: |
          created_at=$(terraform output -raw created_at 2>/dev/null) || created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "TF_VAR_created_at=$created_at" >> "$GITHUB_ENV"
      - name: Apply the ephemeral layer
        run: terraform apply -input=false -auto-approve
