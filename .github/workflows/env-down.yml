name: env-down

on:
  workflow_dispatch:

permissions:
  contents: read

# Shared with env-up so the two never run at the same time. Never cancelled:
# interrupting Terraform would leave its state locked.
concurrency:
  group: ephemeral-environment
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-deploy
    defaults:
      run:
        working-directory: infra/ephemeral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Initialize Terraform
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false -lockfile=readonly -backend-config="bucket=bitmarket-tfstate-$account_id"
      # An empty state succeeds with no outputs; an unreadable one aborts here.
      - name: Resolve the creation time
        run: |
          outputs=$(terraform output -json)
          created_at=$(jq -r '.created_at.value // empty' <<<"$outputs")
          if [ -z "$created_at" ]; then
            created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi
          echo "TF_VAR_created_at=$created_at" >> "$GITHUB_ENV"
      # A literal, so destroying does not depend on the image still being in ECR.
      - name: Destroy the ephemeral layer
        env:
          TF_VAR_backend_image_tag: unused-on-destroy
        run: terraform destroy -input=false -auto-approve
      # The provider only deregisters task definitions, and INACTIVE revisions
      # stay tagged. The API accepts at most 10 revisions per call.
      - name: Delete the inactive task definitions
        run: |
          revisions=$(aws ecs list-task-definitions \
            --family-prefix bitmarket-backend \
            --status INACTIVE \
            --query taskDefinitionArns \
            --output json)
          jq -r '.[]' <<<"$revisions" \
            | xargs -r -n 10 aws ecs delete-task-definitions --query failures --task-definitions
      # The tagging API keeps returning deleted resources for a while.
      - name: Check that no tagged resources remain
        run: |
          deadline=$((SECONDS + 900))
          while true; do
            remaining=$(aws resourcegroupstaggingapi get-resources \
              --tag-filters Key=bitmarket:created-at \
              --query 'ResourceTagMappingList[].ResourceARN' \
              --output text)
            if [ -z "$remaining" ]; then
              echo "No tagged resources remain."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Tagged resources remain after 15 minutes:" >&2
              echo "$remaining" | tr '\t' '\n' >&2
              exit 1
            fi
            sleep 30
          done
