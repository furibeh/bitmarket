name: images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws-images
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    env:
      REPOSITORY: bitmarket/${{ matrix.image }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      # Tags are immutable: without this check, re-running a partially failed
      # workflow would fail when pushing the image that was already published.
      - name: Check whether the tag is already published
        id: existing
        run: |
          if output=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" 2>&1); then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif ! grep -q ImageNotFoundException <<< "$output"; then
            echo "$output" >&2
            exit 1
          fi
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        if: steps.existing.outputs.published != 'true'
        id: ecr
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.published != 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.published != 'true'
        with:
          context: ${{ matrix.image }}
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
